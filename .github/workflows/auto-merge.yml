# ============================================================================
# Auto-merge / third-party triage
# ============================================================================
# The branching contract:
#
#   * PRs authored by the repo owner (MaskirovkaOtdel) are configured for
#     auto-merge into `main` via rebase (fast-forward) once CI is green.
#
#   * PRs from anyone else are contained on the `contrib` landing zone. Any
#     third-party PR targeting `main` is retargeted to `contrib`, labeled
#     `third-party`, and assigned to the owner for manual review. It is never
#     auto-merged.
#
# SECURITY: this workflow runs on `pull_request_target` so it holds a write
# token even for fork PRs. It deliberately NEVER checks out or executes the
# PR's code — it only moves/labels/comments via the GitHub API. The actual
# build/test of PR code happens in ci.yml under a read-only token.
# ============================================================================

name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OWNER: MaskirovkaOtdel

jobs:
  triage:
    name: triage PR
    runs-on: ubuntu-latest
    # Never act on drafts.
    if: github.event.pull_request.draft == false
    steps:
      - name: Install GitHub CLI context
        run: |
          echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          echo "GH_REPO=${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Owner PR — approve and enable auto-merge
        if: github.event.pull_request.user.login == 'MaskirovkaOtdel'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          echo "Owner PR #$PR_NUMBER (head: $HEAD_REF) — configuring auto-merge."

          # Attempt bot approval (distinct reviewer) if required
          gh pr review "$PR_NUMBER" --approve \
            || echo "::notice::Auto-approval skipped or unnecessary."

          # Enable native auto-merge with rebase to preserve commit SHAs
          # Only delete branch if it is a disposable feature branch, never the contrib branch
          DELETE_FLAG=""
          if [ "$HEAD_REF" != "contrib" ]; then
            DELETE_FLAG="--delete-branch"
          fi

          gh pr merge "$PR_NUMBER" --rebase --auto $DELETE_FLAG

      - name: Third-party PR — contain on contrib landing zone
        if: github.event.pull_request.user.login != 'MaskirovkaOtdel'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          echo "Third-party PR #$PR_NUMBER (base: $BASE_REF) — containing."

          # Retarget to the contrib landing zone if it aimed at main.
          if [ "$BASE_REF" = "main" ]; then
            gh pr edit "$PR_NUMBER" --base contrib
            echo "Retargeted #$PR_NUMBER to contrib."
          fi

          gh pr edit "$PR_NUMBER" --add-label "third-party"

          # Idempotent review request + notice comment.
          gh pr comment "$PR_NUMBER" --body \
            "Thanks for the contribution! 🙌

          This PR has been routed to the \`contrib\` landing zone for review.
          It will **not** be auto-merged. Once reviewed and approved by @$OWNER, it moves
          into \`main\`. CI runs on \`contrib\` exactly as it does on \`main\`."

          gh pr edit "$PR_NUMBER" --add-reviewer "$OWNER" || true
