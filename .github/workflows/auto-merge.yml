# ============================================================================
# Auto-merge / third-party triage
# ============================================================================
# The branching contract:
#
#   * PRs authored by the repo owner (MaskirovkaOtdel) are auto-approved and
#     auto-merged into `main` once CI is green.
#
#   * PRs from anyone else are contained on the `contrib` landing zone. Any
#     third-party PR targeting `main` is retargeted to `contrib`, labeled
#     `third-party`, and left for manual review. It is never auto-merged.
#
# SECURITY: this workflow runs on `pull_request_target` so it holds a write
# token even for fork PRs. It deliberately NEVER checks out or executes the
# PR's code — it only moves/labels/comments via the GitHub API. The actual
# build/test of PR code happens in ci.yml under a read-only token.
# ============================================================================

name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OWNER: MaskirovkaOtdel

jobs:
  triage:
    name: triage PR
    runs-on: ubuntu-latest
    # Never act on drafts.
    if: github.event.pull_request.draft == false
    steps:
      - name: Install GitHub CLI context
        # GH_REPO tells `gh` which repository to target. This workflow
        # deliberately never checks out code (pull_request_target security), so
        # `gh` cannot infer the repo from a git remote — without this every
        # `gh pr ...` call fails with "not a git repository".
        run: |
          echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          echo "GH_REPO=${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Owner PR — approve
        if: github.event.pull_request.user.login == 'MaskirovkaOtdel'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "Owner PR #$PR_NUMBER — approving."

          # A PR cannot be approved by its own author. Since the owner pushes
          # branches under their own identity, the Actions bot (GH_TOKEN from
          # GITHUB_ENV) is a distinct reviewer and this approval is valid. This
          # step deliberately keeps the bot token — using the owner's PAT here
          # would be a self-approval, which GitHub rejects.
          gh pr review "$PR_NUMBER" --approve \
            || echo "::warning::Could not auto-approve (likely self-authored)."

      - name: Owner PR — enable auto-merge
        if: github.event.pull_request.user.login == 'MaskirovkaOtdel'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_METHOD: squash
          # Merge under the OWNER's identity, not the Actions bot. GitHub
          # silently suppresses push events caused by GITHUB_TOKEN, so a
          # bot-attributed merge would NOT trigger CI / Release / Sync-contrib
          # on main. The PAT restores normal push events. Falls back to the
          # bot token if the secret is missing (merge still works, but the
          # downstream automations will not fire).
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::warning::AUTO_MERGE_TOKEN is not set — merging as the bot. Downstream push-triggered workflows will NOT run."
          fi

          # Enable native auto-merge; GitHub merges once all required checks
          # and protections pass. Requires "Allow auto-merge" in repo settings.
          gh pr merge "$PR_NUMBER" --"$MERGE_METHOD" --auto \
            --delete-branch

      - name: Third-party PR — contain on contrib landing zone
        if: github.event.pull_request.user.login != 'MaskirovkaOtdel'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          echo "Third-party PR #$PR_NUMBER (base: $BASE_REF) — containing."

          # Retarget to the contrib landing zone if it aimed at main.
          if [ "$BASE_REF" = "main" ]; then
            gh pr edit "$PR_NUMBER" --base contrib
            echo "Retargeted #$PR_NUMBER to contrib."
          fi

          gh pr edit "$PR_NUMBER" --add-label "third-party"

          # Idempotent review request + notice comment.
          gh pr comment "$PR_NUMBER" --body \
            "Thanks for the contribution! 🙌

          This PR has been routed to the \`contrib\` landing zone for review.
          It will **not** be auto-merged. Once reviewed and approved it moves
          into \`main\`. CI runs on \`contrib\` exactly as it does on \`main\`."

          gh pr edit "$PR_NUMBER" --add-reviewer "$OWNER" || true
