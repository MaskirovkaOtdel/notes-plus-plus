# ============================================================================
# Release — versioned tagging & release notes
# ============================================================================
# Runs the version engine (scripts/version-engine.mjs) to evaluate Conventional
# Commits since the last release tag:
#   * fix: / perf: / revert:  -> X.X.1 -> X.X.2 (patch)
#   * feat:                   -> X.1.X -> X.2.X (minor)
#   * BREAKING CHANGE / !:    -> 0.(X+1).0 below 1.0 (minor), X.0.0 at 1.0+
#
# Generates structured release notes via scripts/release-notes.mjs and creates
# a GitHub Release and git tag.
#
# Triggers:
#   - push to main
#   - pull_request closed & merged into main
#   - workflow_dispatch (manual on-demand; optional force and explicit version inputs)
# ============================================================================

name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      force:
        description: "Force cut release (bypass gate checks)"
        type: boolean
        default: false
      version:
        description: "Explicit version to cut, exactly X.Y.Z (deliberate cut; overrides the computed bump)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: compute version & release
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Engine regression coverage
        run: node --test scripts/version-engine.test.mjs

      - name: Determine next version
        id: version
        env:
          FORCE: ${{ inputs.force == true && '--force' || '' }}
          # The version input reaches the engine through an env var, never
          # inline ${{ }} interpolation — a user-supplied string must not be
          # able to reach the runner's shell. The engine validates strict
          # X.Y.Z and hard-exits on bad input before doing anything.
          VERSION_OVERRIDE: ${{ inputs.version || '' }}
        run: |
          set -uo pipefail

          # The engine exits 0 to release, 2 to skip (anything else = invalid
          # override input, annotated as an error below).
          set +e
          node scripts/version-engine.mjs --github-output $FORCE
          code=$?
          set -e

          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then
            echo "engine exit code: $code (0=release, 2=skip)"
            exit 0
          fi
          echo "::error::version engine crashed with exit code $code"
          exit "$code"

      - name: Show decision
        if: steps.version.outputs.should_release == 'true'
        run: |
          echo "Releasing ${{ steps.version.outputs.next_version }} (bump: ${{ steps.version.outputs.bump }})"

      - name: Generate release notes
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
          VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          PREV="${{ steps.version.outputs.previous_version }}"
          BASE=""
          if [ "$PREV" != "none" ]; then BASE="$PREV"; fi
          node scripts/release-notes.mjs "$BASE" HEAD "$VERSION" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create tag and GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail

          # An annotated tag needs a committer identity on the runner.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Dedupe: never re-tag an existing version.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::$VERSION already exists; skipping."
            exit 0
          fi

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

          # Create the GitHub Release with the generated notes.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest

          echo "Created release $VERSION."

      - name: Skip notice
        if: steps.version.outputs.should_release != 'true'
        run: echo "::notice::No release-worthy changes (or gates blocked) — skipping release."
