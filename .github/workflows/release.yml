# ============================================================================
# Release — versioned tagging with anti-overflow gates
# ============================================================================
# Runs the version engine (scripts/version-engine.mjs) to decide whether a
# release should be cut and what the next version is, then creates the tag
# and a GitHub Release with generated notes.
#
# Anti-overflow guarantees (all enforced in the engine, not here):
#   1. Only feat / fix / perf / revert / BREAKING commits produce a release.
#   2. Changes touching only docs/meta/config are ignored.
#   3. A cooldown window batches rapid merges into a single release.
#   4. A rolling 24h cap prevents runaway tag floods.
#   5. Duplicate versions are never re-created.
#
# Triggers:
#   - push to main   : normal path, subject to all gates
#   - schedule (hourly): flushes anything waiting out its cooldown
#   - workflow_dispatch: manual, with an optional "force" input
# ============================================================================

name: Release

on:
  push:
    branches: [main]
  schedule:
    # Hourly flush so a release that became eligible during a cooldown window
    # is cut shortly after it expires, without manual intervention.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass cooldown and cap (use for hotfixes only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: compute version & release
    runs-on: ubuntu-latest
    # A scheduled run only needs to act when something is actually pending.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Determine next version
        id: version
        env:
          FORCE: ${{ inputs.force == true && '--force' || '' }}
        run: |
          set -euo pipefail
          node scripts/version-engine.mjs --github-output $FORCE

      - name: Show decision
        if: steps.version.outputs.should_release == 'true'
        run: |
          echo "Releasing ${{ steps.version.outputs.next_version }} (bump: ${{ steps.version.outputs.bump }})"

      - name: Generate release notes
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
          VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          PREV="${{ steps.version.outputs.previous_version }}"
          BASE=""
          if [ "$PREV" != "none" ]; then BASE="$PREV"; fi
          node scripts/release-notes.mjs "$BASE" HEAD "$VERSION" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create tag and GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail

          # Belt-and-braces dedupe: never re-tag an existing version.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::$VERSION already exists; skipping."
            exit 0
          fi

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

          # Create the GitHub Release with the generated notes.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest

          echo "Created release $VERSION."

      - name: Skip notice
        if: steps.version.outputs.should_release != 'true'
        run: echo "::notice::No release-worthy changes (or gates blocked) — skipping release."
