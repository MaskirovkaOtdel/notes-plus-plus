packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# pnpm 12 reads these settings from pnpm-workspace.yaml, not package.json.
autoInstallPeers: true
strictPeerDependencies: false
linkWorkspacePackages: true
saveWorkspaceProtocol: rolling

# Explicitly approve the small set of dependencies that need to run build
# scripts (esbuild compiles native binaries; the rest ship prebuilt assets).
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
  sharp: true
  playwright: true
  playwright-core: true
  "@playwright/test": true

catalog:
  react: ^19.2.0
  react-dom: ^19.2.0
  typescript: ^5.9.3
  vite: ^7.1.12
  vitest: ^3.2.4
  "@vitest/coverage-v8": ^3.2.4
  fastify: ^5.6.1
  drizzle-orm: ^0.45.2
  zod: ^4.1.13
  tailwindcss: ^4.1.16
  eslint: ^9.39.1
  prettier: ^3.6.2
